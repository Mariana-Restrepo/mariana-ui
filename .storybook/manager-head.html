<meta name="description" content="mariana-ui · Sistema de diseño de Mariana Restrepo para apps web y móviles." />

<script>
  // Pestaña del navegador: "Button ⋅ mariana-ui" en lugar de "… ⋅ Storybook".
  // Buscador: textos en español.
  (function () {
    function ajustar() {
      if (document.title.indexOf('Storybook') !== -1) {
        document.title = document.title.replace(/Storybook/g, 'mariana-ui')
      }
      var buscador = document.getElementById('storybook-explorer-searchfield')
      if (buscador && buscador.placeholder !== 'Buscar en mariana-ui') {
        buscador.placeholder = 'Buscar en mariana-ui'
        buscador.setAttribute('aria-label', 'Buscar en mariana-ui')
      }
    }
    new MutationObserver(ajustar).observe(document.documentElement, { subtree: true, childList: true, characterData: true })
    document.addEventListener('DOMContentLoaded', ajustar)
  })()
</script>
